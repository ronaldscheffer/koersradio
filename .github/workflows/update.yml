name: Update cycling news
on:
  schedule:
    # 9:00 / 13:00 / 18:00 Nederlandse tijd, 3x per dag (kosten besparen)
    # cron draait in UTC en kent geen tijdzones, dus twee regels voor zomer-/wintertijd:
    - cron: "0 7,11,16 * 4-10 *"   # CEST (UTC+2), april t/m oktober
    - cron: "0 8,12,17 * 11,12,1,2,3 *" # CET (UTC+1), november t/m maart
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node scripts/update.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "koersradio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
