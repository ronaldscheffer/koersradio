name: Discover new sources
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/discover.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated feeds
        run: |
          git config user.name "koersradio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feeds.json feeds-rejected.json
          git diff --cached --quiet || git commit -m "Discover new sources $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
